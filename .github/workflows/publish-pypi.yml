# Publishes python/ to PyPI as `scrapier` when a vX.Y.Z tag is pushed.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere. The
# trusted publisher on pypi.org names this repo, this file and the `pypi`
# environment, so renaming any of them breaks publishing.

name: publish-pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test both CLIs
        run: node --test tests/cli.test.mjs
        env:
          PYTHON: python
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('python/src/scrapier/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build
        run: python -m pip install --quiet build && python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
