name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '22']
        python: ['3.8', '3.13']
        exclude:
          # setup-python has no 3.8 build for macOS arm64 or the current Ubuntu
          # image; Windows still covers 3.8.
          - os: macos-latest
            python: '3.8'
          - os: ubuntu-latest
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: node --test tests/cli.test.mjs
        env:
          PYTHON: python
